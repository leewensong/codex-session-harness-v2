[project]
name = "codex-mcp-server"
version = "0.1.0"
description = "MCP server exposing Codex (ChatGPT desktop) session capabilities to local AI models"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_mcp"]
