# Public V2 ingress: HTTPS form login + cookie auth, never HTTP Basic challenge.
map $http_origin $codex_v2_backend_origin {
    default $http_origin;
    "https://copyto.me:8061" "http://copyto.me:8061";
}
map $http_upgrade $codex_v2_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8061 ssl;
    listen [::]:8061 ssl;
    server_name copyto.me;
    ssl_certificate /etc/letsencrypt/live/copyto.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copyto.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic off;
    client_max_body_size 65m;
    access_log /var/log/nginx/codex-v2-8061.access.log;
    error_log /var/log/nginx/codex-v2-8061.error.log;

    location = /_v2_auth {
        internal;
        proxy_pass http://127.0.0.1:18062/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location = /access {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18062;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header WWW-Authenticate;
    }
    location = /logout {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18062;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header WWW-Authenticate;
    }
    location @codex_v2_login {
        # APIs and WebSockets fail with 401; only browser navigation redirects.
        if ($http_upgrade != "") { return 401; }
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        if ($http_accept !~* text/html) { return 401; }
        return 303 /access;
    }
    location / {
        auth_request /_v2_auth;
        error_page 401 = @codex_v2_login;
        proxy_pass http://127.0.0.1:18061;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Origin $codex_v2_backend_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_v2_connection_upgrade;
        proxy_hide_header WWW-Authenticate;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
